<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Adivinhação</title>
  <style>
    /* Reset e variáveis de cor (suporte a modo escuro) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #fff;
      --bg2: #f5f5f3;
      --bg3: #eeecea;
      --tx: #1a1a18;
      --tx2: #5f5e5a;
      --tx3: #88877f;
      --bd: rgba(0, 0, 0, .12);
      --bd2: rgba(0, 0, 0, .22);
      --r: 8px;
      --rl: 12px;
      --font: system-ui, sans-serif;
      --g-bg: #eaf3de;
      --g-tx: #3b6d11;
      --r-bg: #fcebeb;
      --r-tx: #a32d2d;
      --i-bg: #e6f1fb;
      --i-tx: #185fa5;
    }

    @media(prefers-color-scheme:dark) {
      :root {
        --bg: #1e1e1c;
        --bg2: #2a2a28;
        --bg3: #333330;
        --tx: #f0ede8;
        --tx2: #b4b2a9;
        --tx3: #888780;
        --bd: rgba(255, 255, 255, .12);
        --bd2: rgba(255, 255, 255, .22);
        --g-bg: #173404;
        --g-tx: #c0dd97;
        --r-bg: #501313;
        --r-tx: #f7c1c1;
        --i-bg: #042c53;
        --i-tx: #b5d4f4;
      }
    }

    /* Layout geral */
    body {
      font-family: var(--font);
      background: var(--bg3);
      color: var(--tx);
      min-height: 100vh;
      padding: 1rem
    }

    .conteudo {
      max-width: 560px;
      margin: 0 auto
    }

    /* Cabeçalho */
    .cabecalho {
      text-align: center;
      padding: 1.25rem 0 1rem;
      border-bottom: .5px solid var(--bd);
      margin-bottom: 1.25rem
    }

    .cabecalho h1 {
      font-size: 22px;
      font-weight: 500
    }

    .cabecalho p {
      font-size: 13px;
      color: var(--tx2);
      margin-top: 3px
    }

    /* Telas — só uma ativa por vez */
    .tela {
      display: none;
      flex-direction: column;
      gap: 10px
    }

    .tela.ativa {
      display: flex
    }

    /* Cartão */
    .cartao {
      background: var(--bg);
      border: .5px solid var(--bd);
      border-radius: var(--rl);
      padding: 1.1rem
    }

    .rotulo {
      font-size: 13px;
      color: var(--tx2);
      margin-bottom: 8px
    }

    .pergunta {
      font-size: 18px;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: .9rem
    }

    /* Botões */
    .linha {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center
    }

    button {
      cursor: pointer;
      font-family: var(--font);
      font-size: 14px;
      border-radius: var(--r);
      padding: 8px 18px;
      border: .5px solid var(--bd2);
      background: transparent;
      color: var(--tx);
      transition: background .15s
    }

    button:hover {
      background: var(--bg2)
    }

    button.p {
      background: var(--tx);
      color: var(--bg);
      border-color: var(--tx)
    }

    button.p:hover {
      opacity: .85
    }

    button.d {
      border-color: var(--r-tx);
      color: var(--r-tx)
    }

    button.d:hover {
      background: var(--r-bg)
    }

    /* Grid de categorias */
    .grade-categorias {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px
    }

    .categoria-card {
      display: grid;
      gap: 8px;
      border-radius: var(--r);
      border: .5px solid var(--bd);
      background: var(--bg2);
      padding: 8px;
    }

    .botao-categoria {
      width: 100%;
      padding: 14px 10px;
      text-align: center;
      border-radius: var(--r);
      border: .5px solid var(--bd);
      background: var(--bg2);
      cursor: pointer;
      font-size: 14px;
      font-family: var(--font);
      color: var(--tx);
      transition: border-color .15s, background .15s
    }

    .botao-excluir-cat {
      width: 100%;
      padding: 8px 10px;
      text-align: center;
      border-radius: var(--r);
      border: .5px solid var(--r-tx);
      background: transparent;
      color: var(--r-tx);
      font-size: 13px;
      transition: background .15s;
    }

    .botao-excluir-cat:hover {
      background: var(--r-bg);
    }

    .botao-categoria:hover {
      border-color: var(--bd2);
      background: var(--bg)
    }

    .icone-categoria {
      font-size: 22px;
      margin-bottom: 4px
    }

    .lista-opcoes {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid var(--bd);
      border-radius: var(--r);
      background: var(--bg2)
    }

    .lista-opcoes ul {
      list-style: none;
      display: grid;
      gap: 8px
    }

    .lista-opcoes li {
      font-size: 13px;
      color: var(--tx2)
    }

    .lista-opcoes strong {
      color: var(--tx);
      display: block;
      margin-bottom: 2px
    }

    .lista-opcoes span {
      display: block;
      line-height: 1.4
    }

    /* Input */
    input {
      width: 100%;
      font-size: 14px;
      font-family: var(--font);
      padding: 8px 12px;
      border: .5px solid var(--bd2);
      border-radius: var(--r);
      background: transparent;
      color: var(--tx);
      outline: none
    }

    input:focus {
      box-shadow: 0 0 0 2px var(--i-tx)
    }

    /* Badge de status */
    .badge {
      display: inline-block;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
      background: var(--g-bg);
      color: var(--g-tx)
    }

    .badge.e {
      background: var(--r-bg);
      color: var(--r-tx)
    }

    .badge.i {
      background: var(--i-bg);
      color: var(--i-tx)
    }

    /* Barra de progresso na árvore */
    .barra {
      height: 4px;
      background: var(--bg2);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 4px
    }

    .preenchimento {
      height: 100%;
      background: var(--tx);
      border-radius: 2px;
      transition: width .4s
    }

    hr {
      border: none;
      border-top: .5px solid var(--bd);
      margin: 10px 0
    }

    .mt {
      margin-top: 8px
    }

    .mts {
      margin-top: 6px
    }

    .dica {
      font-size: 12px;
      color: var(--tx3);
      margin-top: 4px
    }

    .centralizado {
      text-align: center;
      padding: 1.5rem
    }
  </style>
</head>

<body>
  <div class="conteudo">

    <!-- Cabeçalho -->
    <div class="cabecalho">
      <h1>Jogo de Adivinhação</h1>
      <p>Pense em algo e responderei sim/não até acertar</p>
    </div>

    <!-- MENU: grade de categorias disponíveis -->
    <div id="tela-menu" class="tela ativa">
      <div class="cartao">
        <div class="rotulo">Escolha uma categoria</div>
        <div class="grade-categorias" id="grade-categorias"></div>
        <div class="lista-opcoes" id="lista-opcoes" style="display:none"></div>
        <div class="mts"></div>
        <button onclick="toggleOpcoes()" id="btn-ver-opcoes">Ver alternativas por categoria</button>
      </div>
      <div class="cartao">
        <div class="rotulo">Adicionar categoria</div>
        <button onclick="go('tela-nova-categoria')">Nova categoria +</button>
      </div>
    </div>

    <!-- JOGO: perguntas sim/não percorrendo a árvore da categoria -->
    <div id="tela-jogo" class="tela">
      <div class="cartao">
        <div class="rotulo" id="rotulo-pergunta">Pergunta</div>
        <div class="barra">
          <div class="preenchimento" id="barra-progresso" style="width:0%"></div>
        </div>
        <p class="dica" id="dica-pergunta"></p>
        <hr>
        <p class="pergunta" id="texto-pergunta"></p>
        <div class="linha">
          <button class="p" onclick="ans(true)">Sim</button>
          <button onclick="ans(false)">Não</button>
          <button class="d" style="margin-left:auto" onclick="goMenu()">Sair</button>
        </div>
      </div>
    </div>

    <!-- PALPITE FINAL: exibe o item que o jogo acha que é -->
    <div id="tela-palpite" class="tela">
      <div class="cartao">
        <div class="badge i" id="badge-palpite">Meu palpite</div>
        <p class="pergunta" id="texto-palpite"></p>
        <div class="linha">
          <button class="p" onclick="correct()">Sim, acertou!</button>
          <button onclick="wrong()">Não, errou</button>
        </div>
      </div>
    </div>

    <!-- APRENDER: coleta novo item e pergunta quando o jogo erra -->
    <div id="tela-aprender" class="tela">
      <div class="cartao">
        <div class="badge e">Errei! Vou aprender</div>
        <p class="pergunta">Qual era a resposta?</p>
        <input id="campo-item" placeholder="Nome do item que você pensou">
        <p class="dica mt" id="dica-aprendizado"></p>
        <div class="mts"></div>
        <input id="campo-pergunta" placeholder="Pergunta que diferencia os dois">
        <p class="dica mt" id="texto-resposta"></p>
        <div class="linha mts" id="linha-respostas">
          <button class="p" onclick="learnAns('s')">Sim</button>
          <button onclick="learnAns('n')">Não</button>
        </div>
      </div>
    </div>

    <!-- RESULTADO: acerto ou aprendizado concluído -->
    <div id="tela-vitoria" class="tela">
      <div class="cartao centralizado">
        <div class="badge" id="badge-resultado">Acertei!</div>
        <p class="pergunta" id="texto-resultado" style="margin:12px 0"></p>
        <div class="linha" style="justify-content:center">
          <button class="p" onclick="goMenu()">Jogar de novo</button>
        </div>
      </div>
    </div>

    <!-- NOVA CATEGORIA: cria árvore com dois itens iniciais -->
    <div id="tela-nova-categoria" class="tela">
      <div class="cartao">
        <div class="rotulo">Nova categoria</div>
        <input id="campo-nome-categoria" placeholder="Nome da categoria (ex: Países)">
        <div class="mt"></div>
        <input id="campo-emoji-categoria" placeholder="Emoji da categoria (ex: 🌍)">
        <div class="mt"></div>
        <input id="campo-item1" placeholder="Primeiro item (ex: Brasil)">
        <div class="mts"></div>
        <input id="campo-item2" placeholder="Segundo item (ex: Argentina)">
        <p class="dica mt">Pergunta que diferencia os dois:</p>
        <div class="mts"></div>
        <input id="campo-pergunta-categoria" placeholder="Ex: O país fala português?">
        <p class="dica mt">Para "<span id="texto-item1">primeiro item</span>", a resposta é:</p>
        <div class="linha mts">
          <button class="p" onclick="newCat('s')">Sim</button>
          <button onclick="newCat('n')">Não</button>
        </div>
        <hr>
        <div class="linha" style="justify-content:space-between;gap:8px">
          <button onclick="goMenu()">Voltar</button>
          <button onclick="goMenu()">Cancelar</button>
        </div>
      </div>
    </div>

  </div>
  <script>
    // Ícones usados na tela inicial para deixar cada categoria mais visual.
    const ICONS = { "Animais": "🐘", "Jogos Eletrônicos": "🎮", "Países": "🌍", "Filmes": "🎬", "Esportes": "⚽" };

    // Cria um nó da árvore de decisão com o texto em 'dado'.
    // Cada nó pode ser uma pergunta ou um item final, e os campos
    // 'sim' e 'nao' apontam para os próximos nós.
    const N = d => ({ dado: d, sim: null, nao: null });

    // Verifica se um nó é uma folha, ou seja, não tem ramos de resposta.
    const leaf = n => !n.sim && !n.nao;

    // Persiste as categorias no localStorage do navegador para manter o aprendizado.
    const save = c => {
      try {
        localStorage.setItem('jogo_cats', JSON.stringify(c));
      } catch (e) {
        // Ignorar erros de armazenamento para não quebrar a interface.
      }
    };

    // Carrega os dados salvos, retornando null quando não houver nada.
    const loadData = () => {
      try {
        const d = localStorage.getItem('jogo_cats');
        if (d) return JSON.parse(d);
      } catch (e) {
        // Ignorar erros de leitura/parsing.
      }
      return null;
    };

    // Cria as categorias e árvores iniciais para o primeiro uso.
    function buildDefaults() {
      const cats = {};

      // Animais
      let a = N("O animal vive na água?");
      a.sim = N("O animal tem escamas?"); a.nao = N("O animal late?");
      a.sim.sim = N("Peixe"); a.sim.nao = N("Golfinho");
      a.nao.sim = N("Cachorro"); a.nao.nao = N("O animal mia?");
      a.nao.nao.sim = N("Gato"); a.nao.nao.nao = N("Elefante");
      a.icone = '🐘';
      cats["Animais"] = a;

      // Jogos Eletrônicos
      let j = N("O jogo é de mundo aberto?");
      j.sim = N("O jogo possui blocos?"); j.nao = N("O jogo é de luta?");
      j.sim.sim = N("Minecraft"); j.sim.nao = N("GTA V");
      j.nao.sim = N("Street Fighter"); j.nao.nao = N("O jogo é de corrida?");
      j.nao.nao.sim = N("Mario Kart"); j.nao.nao.nao = N("Tetris");
      j.icone = '🎮';
      cats["Jogos Eletrônicos"] = j;

      // Países
      let p = N("O país fica na América?");
      p.sim = N("O país fala português?"); p.nao = N("O país fica na Europa?");
      p.sim.sim = N("Brasil"); p.sim.nao = N("Argentina");
      p.nao.sim = N("O país faz fronteira com a França?"); p.nao.nao = N("Japão");
      p.nao.sim.sim = N("Espanha"); p.nao.sim.nao = N("Alemanha");
      p.icone = '🌍';
      cats["Países"] = p;

      // Filmes
      let f = N("O filme é de animação?");
      f.sim = N("O filme é da Disney/Pixar?"); f.nao = N("O filme é de super-herói?");
      f.sim.sim = N("Toy Story"); f.sim.nao = N("Shrek");
      f.nao.sim = N("Homem-Aranha"); f.nao.nao = N("O filme é de terror?");
      f.nao.nao.sim = N("It: A Coisa"); f.nao.nao.nao = N("Titanic");
      f.icone = '🎬';
      cats["Filmes"] = f;

      // Esportes
      let e = N("O esporte usa bola?");
      e.sim = N("O esporte é jogado com os pés?"); e.nao = N("O esporte é individual?");
      e.sim.sim = N("Futebol"); e.sim.nao = N("Basquete");
      e.nao.sim = N("O esporte usa raquete?"); e.nao.nao = N("Vôlei");
      e.nao.sim.sim = N("Tênis"); e.nao.sim.nao = N("Natação");
      e.icone = '⚽';
      cats["Esportes"] = e;

      return cats;
    }

    let cats = loadData() || buildDefaults();
    let curCat, cur, depth, lItem, lQ, lAns;

    // Controla qual tela aparece na tela principal.
    const go = id => {
      document.querySelectorAll('.tela').forEach(tela => tela.classList.remove('ativa'));
      document.getElementById(id).classList.add('ativa');
    };

    // Reconstrói a lista de categorias sempre que o usuário volta ao menu.
    function goMenu() {
      const g = document.getElementById('grade-categorias');
      g.innerHTML = '';
      Object.keys(cats).forEach(name => {
        const card = document.createElement('div');
        card.className = 'categoria-card';

        const btn = document.createElement('button');
        btn.className = 'botao-categoria';
        const icon = cats[name].icone || ICONS[name] || '🗂';
        btn.innerHTML = `<div class="icone-categoria">${icon}</div><div>${name}</div>`;
        btn.onclick = () => startGame(name);

        const del = document.createElement('button');
        del.className = 'botao-excluir-cat';
        del.textContent = 'Excluir categoria';
        del.onclick = () => deleteCat(name);

        card.appendChild(btn);
        card.appendChild(del);
        g.appendChild(card);
      });
      const lista = document.getElementById('lista-opcoes');
      lista.style.display = 'none';
      document.getElementById('btn-ver-opcoes').textContent = 'Ver alternativas por categoria';
      go('tela-menu');
    }

    function listarAlternativas(node) {
      if (!node) return [];
      if (leaf(node)) return [node.dado];
      return listarAlternativas(node.sim).concat(listarAlternativas(node.nao));
    }

    function toggleOpcoes() {
      const lista = document.getElementById('lista-opcoes');
      const btn = document.getElementById('btn-ver-opcoes');
      if (lista.style.display === 'none') {
        lista.innerHTML = '<ul>' + Object.keys(cats).map(name => {
          const itens = listarAlternativas(cats[name]);
          const icon = cats[name].icone || ICONS[name] || '🗂';
          return `<li><strong>${icon} ${name}</strong><span>${itens.join(', ')}</span></li>`;
        }).join('') + '</ul>';
        lista.style.display = 'block';
        btn.textContent = 'Ocultar alternativas';
      } else {
        lista.style.display = 'none';
        btn.textContent = 'Ver alternativas por categoria';
      }
    }

    // Inicia uma rodada com a categoria escolhida e reseta a profundidade da árvore.
    function startGame(name) {
      curCat = name;
      cur = cats[name];
      depth = 0;
      step();
    }

    // Calcula a profundidade máxima da árvore de decisão para a categoria atual.
    // Esse valor é usado para definir o progresso visual da pergunta.
    const treeD = n => !n ? 0 : 1 + Math.max(treeD(n.sim), treeD(n.nao));

    // Exibe a próxima pergunta ou o palpite final, dependendo se estamos em uma folha.
    function step() {
      if (leaf(cur)) {
        // Quando chegamos a uma folha, mostramos o palpite do item final.
        document.getElementById('badge-palpite').textContent = 'Meu palpite — ' + curCat;
        document.getElementById('texto-palpite').textContent = 'É ' + cur.dado + '?';
        go('tela-palpite');
      } else {
        // Atualiza a barra de progresso e os textos da pergunta atual.
        const pct = Math.min(100, Math.round((depth / Math.max(treeD(cats[curCat]) - 1, 1)) * 100));
        document.getElementById('barra-progresso').style.width = pct + '%';
        document.getElementById('rotulo-pergunta').textContent = curCat;
        document.getElementById('dica-pergunta').textContent = 'Pergunta ' + (depth + 1);
        document.getElementById('texto-pergunta').textContent = cur.dado;
        go('tela-jogo');
      }
    }

    // --- Resposta sim/não: avança pelo ramo correto da árvore e salva automaticamente ---
    const ans = yes => {
      depth++;
      cur = yes ? cur.sim : cur.nao;
      save(cats);
      step();
    };

    // --- Acerto: o jogo mostrou o palpite certo e encerrou a rodada ---
    function correct() {
      document.getElementById('badge-resultado').className = 'badge';
      document.getElementById('badge-resultado').textContent = 'Acertei!';
      document.getElementById('texto-resultado').textContent = 'Sabia que era ' + cur.dado + '!';
      go('tela-vitoria');
    }

    // --- Erro: o jogo não acertou, então pede para o usuário ensinar um novo item. ---
    function wrong() {
      lItem = '';
      lQ = '';
      lAns = '';
      document.getElementById('dica-aprendizado').textContent = 'Pergunta que diferencia o seu item de "' + cur.dado + '":';
      document.getElementById('texto-resposta').textContent = 'Para o seu item, a resposta é:';
      document.getElementById('campo-item').value = '';
      document.getElementById('campo-pergunta').value = '';
      document.getElementById('linha-respostas').style.display = 'flex';
      go('tela-aprender');
      document.getElementById('campo-item').focus();
    }

    // --- Lê os campos preenchidos pelo usuário e salva a resposta do novo item. ---
    function learnAns(a) {
      const item = document.getElementById('campo-item').value.trim();
      const q = document.getElementById('campo-pergunta').value.trim();
      if (!item || !q) {
        alert("Preencha os campos acima.");
        return;
      }
      lItem = item;
      lQ = q;
      lAns = a;
      document.getElementById('linha-respostas').style.display = 'none';
      learnSave();
    }

    // --- Salva o novo item na árvore: transforma a folha atual em pergunta. ---
    function learnSave() {
      const old = cur.dado;
      cur.dado = lQ;
      cur.sim = lAns === 's' ? N(lItem) : N(old);
      cur.nao = lAns === 's' ? N(old) : N(lItem);
      save(cats);
      document.getElementById('badge-resultado').className = 'badge i';
      document.getElementById('badge-resultado').textContent = 'Aprendi!';
      document.getElementById('texto-resultado').textContent = 'Adicionei "' + lItem + '" ao meu conhecimento! 🧠';
      go('tela-vitoria');
    }

    // --- Cria nova categoria usando a pergunta e itens iniciais fornecidos pelo usuário. ---
    function newCat(ans) {
      const nome = document.getElementById('campo-nome-categoria').value.trim();
      const i1 = document.getElementById('campo-item1').value.trim();
      const i2 = document.getElementById('campo-item2').value.trim();
      const q = document.getElementById('campo-pergunta-categoria').value.trim();
      const icone = document.getElementById('campo-emoji-categoria').value.trim() || '🗂';
      if (!nome || !i1 || !i2 || !q) {
        alert("Preencha todos os campos.");
        return;
      }
      if (cats[nome]) {
        alert("Essa categoria já existe.");
        return;
      }
      const root = N(q);
      root.icone = icone;
      root.sim = ans === 's' ? N(i1) : N(i2);
      root.nao = ans === 's' ? N(i2) : N(i1);
      cats[nome] = root;
      save(cats);
      goMenu();
    }

    // Exclui a categoria selecionada e atualiza o menu.
    function deleteCat(name) {
      if (!cats[name]) return;
      if (!confirm(`Deseja realmente excluir a categoria "${name}"?`)) return;
      delete cats[name];
      save(cats);
      goMenu();
    }

    // Atualiza o label do primeiro item ao digitar
    document.getElementById('campo-item1').addEventListener('input', function () {
      document.getElementById('texto-item1').textContent = this.value.trim() || 'primeiro item';
    });

    // Inicializa o menu ao carregar a página
    goMenu();
  </script>
</body>

</html>
